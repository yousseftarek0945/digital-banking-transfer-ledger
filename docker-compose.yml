services:
  postgres:
    image: postgres:16
    container_name: qnb-postgres
    environment:
      POSTGRES_DB: digital_banking
      POSTGRES_USER: qnb_user
      POSTGRES_PASSWORD: qnb_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: